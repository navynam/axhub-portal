# AX-HUB 백엔드 환경설정
server:
  port: 8080
  servlet:
    context-path: /            # 컨트롤러에서 /api/v1 접두어 사용

spring:
  application:
    name: axhub-backend
  # 개발용 H2 인메모리 DB (실서비스는 PostgreSQL/MySQL 로 교체)
  datasource:
    url: jdbc:h2:mem:axhub;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop     # 개발 편의(재시작 시 스키마 재생성). 운영은 validate/none
    show-sql: true
    properties:
      hibernate.format_sql: true
  h2:
    console:
      enabled: true             # http://localhost:8080/h2-console

# JWT 설정 (운영에서는 환경변수/시크릿으로 주입)
axhub:
  jwt:
    secret: "change-me-please-use-a-long-random-secret-key-32bytes+"
    expire-minutes: 120
  cors:
    allowed-origins: "http://localhost:5173"   # 프론트 개발 서버
